<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StagePatch Pro</title>

  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon180.png">

  <style>
    :root{
      --bg:#0b1020; --panel:#121a33; --panel2:#1a2547; --line:#2e3b6b;
      --txt:#eef3ff; --muted:#a8b6de; --accent:#4f8cff; --danger:#ef4444; --ok:#22c55e;
    }
    *{box-sizing:border-box}
    body{
      margin:0; background:linear-gradient(180deg,#080d1c,#0b1020);
      color:var(--txt); font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
    }
    .app{max-width:1080px; margin:0 auto; padding:12px 12px 90px}
    .card{
      background:rgba(18,26,51,.96); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px;
    }
    h1{margin:0; font-size:1.08rem}
    .sub{margin-top:4px; color:var(--muted); font-size:.86rem}
    .brand-wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .brand-left{display:flex;align-items:center;gap:12px}
    .brand-logo{
      width:64px;height:64px;border-radius:12px;border:1px solid #2e3b6b;
      box-shadow:0 4px 14px rgba(0,0,0,.35);object-fit:cover;
    }
    .brand-title{margin:0;font-size:1.35rem}
    .brand-sub{margin-top:2px;color:var(--muted);font-size:.92rem}
    @media (max-width:520px){
      .brand-logo{width:48px;height:48px}
      .brand-title{font-size:1.15rem}
      .brand-sub{font-size:.84rem}
    }

    .top-actions{display:flex;gap:8px;flex-wrap:wrap}
    .top-actions button{width:auto;padding:10px 12px}
    .btn-lock{background:#1e293b;border-color:#475569}
    .btn-lock.active{background:#334155;border-color:#64748b}

    label{display:block; font-size:.78rem; color:var(--muted); margin-bottom:5px}
    input,select,button{
      width:100%; border:1px solid var(--line); border-radius:10px;
      background:var(--panel2); color:var(--txt); padding:11px; font-size:16px;
    }
    button{cursor:pointer}
    .btn{background:var(--accent); border-color:#76a5ff}
    .btn-danger{background:#3a1419; border-color:#7f1d1d}
    .btn-ghost{background:transparent}
    .btn-ok{background:#10331f; border-color:#1f7a43}
    .btn-warn{background:#3a2b12; border-color:#7c5a1f}

    .grid{display:grid; gap:8px}
    .grid-2{grid-template-columns:1fr 1fr}
    .grid-3{grid-template-columns:1fr 1fr 1fr}
    @media (max-width:720px){ .grid-2,.grid-3{grid-template-columns:1fr} }

    .row{display:flex; gap:8px; flex-wrap:wrap}
    .row > *{flex:1 1 140px}

    .show-pill{
      display:inline-block; padding:6px 10px; border:1px solid #3d56a3;
      border-radius:999px; font-size:.82rem; background:#16244d; margin-top:8px;
    }
    .save-indicator{margin-top:8px;font-size:.78rem;color:var(--muted)}

    .snake-item{
      border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:8px;
      background:#101831;
    }
    .snake-head{display:flex; align-items:center; gap:8px; justify-content:space-between;}
    .snake-title-wrap{display:flex; gap:8px; align-items:center; min-width:0}
    .dot{width:14px;height:14px;border-radius:999px;border:1px solid rgba(255,255,255,.4)}
    .snake-title{font-weight:700; font-size:.95rem}
    .snake-meta{font-size:.8rem; color:var(--muted)}
    .snake-actions{display:flex; gap:6px; flex-wrap:wrap}
    .snake-actions button{padding:8px 10px; font-size:.82rem; width:auto; min-width:42px}

    .editor{
      position:fixed; inset:0; background:rgba(4,8,20,.82); backdrop-filter:blur(2px);
      display:none; z-index:20; padding:8px;
    }
    .editor.open{display:block}
    .editor-panel{
      max-width:980px; margin:0 auto; height:100%;
      background:var(--bg); border:1px solid var(--line); border-radius:14px; overflow:hidden;
      display:flex; flex-direction:column;
    }
    .editor-top{
      padding:10px; border-bottom:1px solid var(--line); background:#0f1730;
      display:grid; gap:8px;
    }
    .tabs{display:flex; gap:8px}
    .tab{
      flex:1; text-align:center; padding:10px; border:1px solid var(--line); border-radius:10px; background:#162247; cursor:pointer;
    }
    .tab.active{background:var(--accent); border-color:#76a5ff}
    .editor-body{padding:10px; overflow:auto; flex:1;}

    .patch-card{
      border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:8px; background:#101a38;
    }
    .patch-title{
      font-weight:700; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;
    }
    .small{font-size:.8rem; color:var(--muted)}

    .result-item{
      border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; background:#101a38;
    }
    .result-top{
      display:flex; justify-content:space-between; gap:8px; align-items:center; margin-bottom:6px; flex-wrap:wrap;
    }
    .badge{
      font-size:.72rem; border:1px solid #4a5fa3; border-radius:999px; padding:2px 8px; background:#172654;
    }
    .result-grid{display:grid; gap:6px; grid-template-columns:1fr 1fr;}
    @media(max-width:720px){ .result-grid{grid-template-columns:1fr} }
    .k{font-size:.74rem;color:var(--muted)}
    .v{font-size:.92rem}

    .sheet-wrap{display:none}
    .sheet-toolbar{
      display:flex; gap:8px; flex-wrap:wrap; align-items:end; margin-bottom:10px;
    }
    .sheet-toolbar .field{min-width:220px; flex:1}
    .sheet-group{
      border:1px solid var(--line); border-radius:12px; margin-bottom:12px; overflow:hidden; background:#101831;
    }
    .sheet-head{
      display:flex; align-items:center; gap:8px; padding:10px; background:#162247; border-bottom:1px solid var(--line);
      font-weight:700;
    }
    .sheet-meta{font-weight:400; color:var(--muted); font-size:.86rem}
    .table-wrap{overflow:auto}
    .sheet-table{
      width:100%; border-collapse:collapse; min-width:760px; font-size:.92rem;
    }
    .sheet-table th{
      position:sticky; top:0; z-index:1;
      background:#1a2547; color:#dfe9ff; text-align:left; padding:8px; border-bottom:1px solid #3e5288;
    }
    .sheet-table td{
      padding:8px; border-bottom:1px solid #2e3b6b; vertical-align:top;
    }
    .sheet-table tbody tr:nth-child(odd){background:#0f1936}
    .sheet-table tbody tr:nth-child(even){background:#111d3f}
    .mono{font-variant-numeric:tabular-nums}
    .muted-x{color:#9fb0da}

    .mode-reading .edit-only{display:none !important}
    .mode-reading .sheet-wrap{display:block}
    .mode-reading .sticky-bottom{display:none}
    .mode-edit .read-only-only{display:none !important}

    .sticky-bottom{
      position:fixed; left:0; right:0; bottom:0; background:#0b1226;
      border-top:1px solid var(--line); padding:8px; z-index:10;
    }
    .sticky-wrap{max-width:1080px; margin:0 auto; display:flex; gap:8px}
    .sticky-wrap button{flex:1}

    .print-only{display:none}

    @media print{
      .no-print,.editor,.sticky-bottom,#searchResults{display:none !important}
      .print-only{display:block !important}
      body{background:#fff;color:#000;font-size:11px}
      .app{max-width:none;padding:0}
      .card,.snake-item{display:none !important;}
      .sheet-wrap{display:none !important;}

      .print-page{page-break-after:auto;break-after:auto;padding:12mm;}
      .print-snake{
        page-break-inside:avoid; break-inside:avoid; margin-bottom:12px;
        border:1px solid #666; border-left:10px solid var(--snake-color, #999);
        border-radius:4px; padding:8px 8px 4px 8px;
        -webkit-print-color-adjust: exact; print-color-adjust: exact;
      }
      .print-snake h3{margin:4px 0 6px;font-size:13px;}
      .print-table{
        width:100%; border-collapse:collapse; margin-bottom:8px;
        page-break-inside:auto; break-inside:auto;
      }
      .print-table th,.print-table td{border:1px solid #555;padding:4px 6px;font-size:10px;}
      .print-table th{background:#eee;-webkit-print-color-adjust: exact;print-color-adjust: exact;}
      .print-table thead{display:table-header-group}
      .print-table tr{page-break-inside:avoid;break-inside:avoid;}
      .muted{color:#444}
    }
  </style>
</head>
<body>
<div class="app mode-edit" id="appRoot">
  <div class="card no-print">
    <div class="brand-wrap">
      <div class="brand-left">
        <img src="icons/icon180.png" alt="StagePatch Pro" class="brand-logo">
        <div>
          <h1 class="brand-title">StagePatch Pro</h1>
          <div class="brand-sub">Organiza tus mangueras de escenario.</div>
        </div>
      </div>
      <div class="top-actions">
        <button id="toggleReadMode" class="btn-lock">🔒 Modo lectura</button>
      </div>
    </div>
  </div>

  <div class="edit-only">
    <div class="card">
      <div class="grid grid-3">
        <div><label>Show / Gira</label><input id="showName" placeholder="Ej: Tour 2026 CDMX"></div>
        <div><label>Artista</label><input id="artistName" placeholder="Ej: Mi Banda"></div>
        <div><label>Fecha</label><input id="showDate" type="date"></div>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="saveShowMeta" class="btn-ghost">Guardar show</button>
        <button id="undoBtn" class="btn-warn no-print">↶ Deshacer</button>
        <button id="redoBtn" class="btn-warn no-print">↷ Rehacer</button>
        <button id="printBtn" class="btn-ghost no-print">Imprimir</button>
      </div>
      <span class="show-pill" id="showBadge">Show: Sin definir</span>
      <div id="saveIndicator" class="save-indicator no-print">Backup: pendiente</div>
    </div>

    <div class="card no-print">
      <div class="grid grid-3">
        <div><label>Nombre subsnake</label><input id="snakeName" placeholder="Ej: Subsnake Batería L"></div>
        <div><label>Entradas</label><select id="snakeChannels"><option>4</option><option>8</option><option selected>12</option><option>16</option><option>24</option></select></div>
        <div>
          <label>Salidas (A-H)</label>
          <select id="snakeReturnsCount">
            <option value="0">0</option>
            <option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8" selected>8</option>
          </select>
        </div>
        <div><label>Color</label><input id="snakeColor" type="color" value="#4f8cff"></div>
        <div><label>Zona</label><input id="snakeZone" placeholder="Tarima Izquierda"></div>
        <div><label>&nbsp;</label><button id="createSnake" class="btn">Crear subsnake</button></div>
      </div>
    </div>

    <div class="card no-print">
      <div class="grid grid-2">
        <div><label>Buscar</label><input id="search" placeholder="snake, canal, fuente, destino..."></div>
        <div>
          <label>Acciones</label>
          <div class="row">
            <button id="saveStagepatch" class="btn-ok">Guardar (.stagepatch)</button>
            <button id="importStagepatch">Importar (.stagepatch)</button>
            <button id="clearAll" class="btn-danger">Borrar todo</button>
          </div>
        </div>
      </div>
      <div class="grid grid-2" style="margin-top:8px">
        <div><label>Impresión</label><select id="printMode"><option value="all">Todas las mangueras</option><option value="one">Solo una manguera</option></select></div>
        <div><label>Manguera a imprimir</label><select id="printSnakeSelect"></select></div>
      </div>
    </div>

    <div id="searchResults" class="card no-print" style="display:none">
      <div class="sub" style="margin-bottom:8px">Resultados del buscador</div>
      <div id="searchResultsList"></div>
    </div>

    <div class="card">
      <div class="sub" style="margin-bottom:8px">Subsnakes</div>
      <div id="snakesList"></div>
    </div>
  </div>

  <div class="sheet-wrap read-only-only">
    <div class="card">
      <div class="sheet-toolbar">
        <div class="field">
          <label>Filtro de manguera</label>
          <select id="sheetSnakeFilter"></select>
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button id="sheetPrintBtn">Imprimir vista</button>
        </div>
      </div>
      <div id="sheetMeta" class="show-pill">Show: Sin definir</div>
    </div>
    <div id="sheetContainer"></div>
  </div>

  <div id="printView" class="print-only"></div>
</div>

<div id="editor" class="editor no-print">
  <div class="editor-panel">
    <div class="editor-top">
      <div class="row">
        <button id="closeEditor">← Volver</button>
        <button id="autoDestBtn">Auto destino entradas</button>
      </div>
      <div class="grid grid-3">
        <div><label>Nombre</label><input id="edName"></div>
        <div><label>Zona</label><input id="edZone"></div>
        <div><label>Color</label><input id="edColor" type="color"></div>
      </div>
      <div class="tabs">
        <div id="tabInputs" class="tab active">Entradas</div>
        <div id="tabOutputs" class="tab">Salidas A-H</div>
      </div>
    </div>
    <div id="editorBody" class="editor-body"></div>
  </div>
</div>

<div class="sticky-bottom no-print edit-only">
  <div class="sticky-wrap">
    <button id="quickNew" class="btn">+ Nuevo subsnake</button>
    <button id="quickPrint">Imprimir</button>
  </div>
</div>

<datalist id="dl-source"></datalist>
<datalist id="dl-destination"></datalist>
<datalist id="dl-mic"></datalist>
<datalist id="dl-notes"></datalist>

<script>
  const RETURN_LABELS = ["A","B","C","D","E","F","G","H"];
  const STAGEPATCH_EXT = ".stagepatch";
  const STAGEPATCH_MIME = "application/x-stagepatch+json";
  const STAGEPATCH_SCHEMA_VERSION = 1;
  const LS_BACKUP_KEY = "stagepatch_backup_v1";
  const LS_MODE_KEY = "stagepatch_view_mode_v1";

  let appData = { show: { name:"", artist:"", date:"" }, snakes: [] };
  let editorSnakeId = null;
  let activeTab = "inputs";
  let viewMode = "edit";

  const HISTORY_LIMIT = 100;
  let undoStack = [];
  let redoStack = [];
  let historyMuted = false;

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" })[m]);
  const deepClone = o => JSON.parse(JSON.stringify(o));
  const snakes = () => appData.snakes;
  function clampR(n){ return Math.min(8, Math.max(0, Number(n) || 0)); }
  function isReadMode(){ return viewMode === "read"; }

  function setSaveIndicator(txt){ $("saveIndicator").textContent = "Backup: " + txt; }

  function snapshot(tag="change"){
    if(historyMuted || isReadMode()) return;
    undoStack.push({ tag, state: deepClone(appData) });
    if(undoStack.length > HISTORY_LIMIT) undoStack.shift();
    redoStack = [];
    updateUndoRedoButtons();
  }

  function restoreState(state){
    appData = deepClone(state);
    normalize();
    refreshShowInputs();
    updateShowBadge();
    renderList();
    renderSearchResults();
    refreshPrintSnakeSelect();
    refreshDatalists();
    refreshSheetFilter();
    renderSheetView();
    if(editorSnakeId && !snakes().find(s=>s.id===editorSnakeId)) closeEditor();
    else if(editorSnakeId) renderEditor();
  }

  function undo(){
    if(isReadMode() || !undoStack.length) return;
    const prev = undoStack.pop();
    redoStack.push({ state: deepClone(appData) });
    historyMuted = true; restoreState(prev.state); historyMuted = false;
    updateUndoRedoButtons();
  }
  function redo(){
    if(isReadMode() || !redoStack.length) return;
    const next = redoStack.pop();
    undoStack.push({ state: deepClone(appData) });
    historyMuted = true; restoreState(next.state); historyMuted = false;
    updateUndoRedoButtons();
  }
  function updateUndoRedoButtons(){
    $("undoBtn").disabled = isReadMode() || !undoStack.length;
    $("redoBtn").disabled = isReadMode() || !redoStack.length;
  }

  function autosaveNow(){
    try{
      localStorage.setItem(LS_BACKUP_KEY, JSON.stringify({ savedAt: new Date().toISOString(), payload: appData }));
      setSaveIndicator("guardado " + new Date().toLocaleTimeString());
    }catch{
      setSaveIndicator("error de guardado");
    }
  }

  function tryRestoreBackup(){
    try{
      const raw = localStorage.getItem(LS_BACKUP_KEY);
      if(!raw) return;
      const data = JSON.parse(raw);
      if(data?.payload?.snakes && Array.isArray(data.payload.snakes) && data.payload.snakes.length){
        if(confirm("Se encontró un backup local automático. ¿Quieres restaurarlo?")){
          appData = { show: data.payload.show || {name:"",artist:"",date:""}, snakes: data.payload.snakes || [] };
        }
      }
    }catch{}
  }

  function loadModePref(){
    try{
      const m = localStorage.getItem(LS_MODE_KEY);
      if(m === "read" || m === "edit") viewMode = m;
    }catch{}
    applyModeUI();
  }

  function toggleMode(){
    viewMode = (viewMode === "edit") ? "read" : "edit";
    try{ localStorage.setItem(LS_MODE_KEY, viewMode); }catch{}
    applyModeUI();
    renderSheetView();
    if(viewMode === "read" && $("editor").classList.contains("open")) closeEditor();
  }

  function applyModeUI(){
    const root = $("appRoot");
    root.classList.toggle("mode-reading", viewMode === "read");
    root.classList.toggle("mode-edit", viewMode === "edit");

    const b = $("toggleReadMode");
    if(viewMode === "read"){
      b.classList.add("active");
      b.textContent = "✏️ Volver a edición";
    } else {
      b.classList.remove("active");
      b.textContent = "🔒 Modo lectura";
    }
    updateUndoRedoButtons();
  }

  function makeChannels(n){ return Array.from({length:n}, (_,i)=>({ channel:i+1, source:"", destination:"", micType:"", notes:"" })); }
  function makeReturns(count=0){
    const c = clampR(count);
    return RETURN_LABELS.slice(0,c).map(l=>({label:l, source:"", destination:"", notes:""}));
  }

  function normalize(){
    appData.show = appData.show || {name:"",artist:"",date:""};
    appData.snakes = (appData.snakes || []).map(s=>{
      const channels = Array.isArray(s.channels) ? s.channels : makeChannels(Number(s.channelsCount)||8);
      const channelsCount = Number(s.channelsCount) || channels.length || 8;
      const returnsCount = clampR(s.returnsCount);
      const returnsOld = Array.isArray(s.returns) ? s.returns : [];
      const returns = RETURN_LABELS.slice(0, returnsCount).map((l, i)=>({
        label:l, source: returnsOld[i]?.source || "", destination: returnsOld[i]?.destination || "", notes: returnsOld[i]?.notes || ""
      }));
      return {
        ...s,
        channelsCount,
        channels: channels.map((c,i)=>({ channel: c.channel || i+1, source:c.source||"", destination:c.destination||"", micType:c.micType||"", notes:c.notes||"" })),
        returnsCount,
        returns
      };
    });
  }

  function updateShowBadge(){
    const s = appData.show;
    const txt = "Show: " + `${s.name || "Sin definir"}${s.artist ? " · " + s.artist : ""}${s.date ? " · " + s.date : ""}`;
    $("showBadge").textContent = txt;
    $("sheetMeta").textContent = txt;
  }

  function saveShowMeta(){
    if(isReadMode()) return;
    snapshot("show meta");
    appData.show.name = $("showName").value.trim();
    appData.show.artist = $("artistName").value.trim();
    appData.show.date = $("showDate").value;
    updateShowBadge();
    renderSheetView();
    alert("Show actualizado.");
  }

  function createSnakeFromData({name, channelsCount, returnsCount, color, zone, channels, returns}){
    if(isReadMode()) return;
    snapshot("create snake");
    const chN = Number(channelsCount) || 8, rN = clampR(returnsCount);
    snakes().unshift({
      id: crypto.randomUUID(), name: name || `Subsnake ${snakes().length+1}`,
      channelsCount: chN, returnsCount: rN, color: color || "#4f8cff", zone: zone || "",
      channels: channels || makeChannels(chN), returns: returns || makeReturns(rN), createdAt: new Date().toISOString()
    });
    renderList(); renderSearchResults(); refreshPrintSnakeSelect(); refreshDatalists(); refreshSheetFilter(); renderSheetView();
  }

  function createSnake(){
    createSnakeFromData({
      name: $("snakeName").value.trim(),
      channelsCount: Number($("snakeChannels").value),
      returnsCount: Number($("snakeReturnsCount").value),
      color: $("snakeColor").value,
      zone: $("snakeZone").value.trim()
    });
    if(!isReadMode()){ $("snakeName").value = ""; $("snakeZone").value = ""; }
  }

  function deleteSnake(id){
    if(isReadMode()) return;
    if(!confirm("¿Eliminar este subsnake?")) return;
    snapshot("delete snake");
    appData.snakes = snakes().filter(s=>s.id!==id);
    renderList(); renderSearchResults(); refreshPrintSnakeSelect(); refreshDatalists(); refreshSheetFilter(); renderSheetView();
  }

  function duplicateSnake(id){
    if(isReadMode()) return;
    const s = snakes().find(x=>x.id===id); if(!s) return;
    snapshot("duplicate snake");
    const cp = deepClone(s); cp.id = crypto.randomUUID(); cp.name = s.name + " (copia)";
    snakes().unshift(cp);
    renderList(); renderSearchResults(); refreshPrintSnakeSelect(); refreshDatalists(); refreshSheetFilter(); renderSheetView();
  }

  function moveSnakeUp(id){
    if(isReadMode()) return;
    const i = appData.snakes.findIndex(s => s.id === id);
    if(i <= 0) return;
    snapshot("move snake up");
    [appData.snakes[i-1], appData.snakes[i]] = [appData.snakes[i], appData.snakes[i-1]];
    renderList(); renderSearchResults(); refreshPrintSnakeSelect(); refreshSheetFilter(); renderSheetView();
  }

  function moveSnakeDown(id){
    if(isReadMode()) return;
    const i = appData.snakes.findIndex(s => s.id === id);
    if(i < 0 || i >= appData.snakes.length - 1) return;
    snapshot("move snake down");
    [appData.snakes[i+1], appData.snakes[i]] = [appData.snakes[i], appData.snakes[i+1]];
    renderList(); renderSearchResults(); refreshPrintSnakeSelect(); refreshSheetFilter(); renderSheetView();
  }

  function renderList(){
    const q = $("search").value.trim().toLowerCase();
    const el = $("snakesList"); el.innerHTML = "";
    const list = snakes().filter(s=>{
      if(!q) return true;
      const txt = [s.name,s.zone,s.channelsCount,s.returnsCount,...s.channels.flatMap(c=>[c.source,c.destination,c.micType,c.notes]),...(s.returns||[]).flatMap(r=>[r.label,r.source,r.destination,r.notes])].join(" ").toLowerCase();
      return txt.includes(q);
    });

    if(!list.length){ el.innerHTML = `<div class="small">No hay subsnakes aún.</div>`; return; }

    list.forEach((s, idx)=>{
      const item = document.createElement("div");
      item.className = "snake-item";
      item.innerHTML = `
        <div class="snake-head">
          <div class="snake-title-wrap">
            <span class="dot" style="background:${s.color}"></span>
            <div>
              <div class="snake-title">${esc(s.name)}</div>
              <div class="snake-meta">
                #${idx+1} · ${s.channelsCount} entradas + ${s.returnsCount} salidas ${s.zone ? "• " + esc(s.zone) : ""}
              </div>
            </div>
          </div>
          <div class="snake-actions">
            <button onclick="moveSnakeUp('${s.id}')" title="Subir">↑</button>
            <button onclick="moveSnakeDown('${s.id}')" title="Bajar">↓</button>
            <button onclick="openEditor('${s.id}')">Editar</button>
            <button onclick="duplicateSnake('${s.id}')">Dup</button>
            <button class="btn-danger" onclick="deleteSnake('${s.id}')">X</button>
          </div>
        </div>`;
      el.appendChild(item);
    });
  }

  function openEditor(id){
    if(isReadMode()) return;
    editorSnakeId = id; activeTab = "inputs";
    $("tabInputs").classList.add("active"); $("tabOutputs").classList.remove("active");
    $("editor").classList.add("open");
    renderEditor();
  }
  function openSnakeAndTab(snakeId, tab){ if(isReadMode()) return; openEditor(snakeId); setTab(tab); }
  function closeEditor(){ $("editor").classList.remove("open"); editorSnakeId = null; }
  function setTab(tab){ activeTab = tab; $("tabInputs").classList.toggle("active", tab==="inputs"); $("tabOutputs").classList.toggle("active", tab==="outputs"); renderEditorBody(); }

  function getSuggestions(){
    const baseSource = [
      "Kick In","Kick Out","Snare Top","Snare Bottom","Snare 2","Snare 3","Hi-Hat","Tom 1","Tom 2","Tom 3","Tom 4","Floor Tom",
      "OH L","OH R","Ride","Crash L","Crash R","Pad L","Pad R","SPD-SX","Sample L","Sample R","Click",
      "Bass DI","Bass Mic","Bass FX","Gtr L","Gtr R","Gtr Acústica DI","Gtr Acústica Mic","Guitarra Flamenca","Gtr Eléctrica SM57","Gtr Eléctrica e906","Gtr Eléctrica Xlr",
      "Ukelele DI","Mandolina DI","Violín DI","Cello DI","Melodica",
      "Keys L","Keys R","Piano L","Piano R","Key 2 L","Key 2 R","Piano 2 L","Piano 2 R","Synth 1 L","Synth 1 R","Synth 2 L","Synth 2 R",
      "Tracks L","Tracks R","Playback L","Playback R","Ableton L","Ableton R","Sampler L","Sampler R",
      "Voz Lead","Voz Lead 2","Coro 1","Coro 2","Coro 3","Coro 4","Talkback FOH","Talkback MON","MC","Narrador","Shout","Backline",
      "Ambiente L","Ambiente R","Audience L","Audience R","Room L","Room R",
      "Trompeta 1","Trompeta 2","Trombón 1","Trombón 2","Saxo Alto","Saxo Tenor","Saxo Barítono","Clarinete","Flauta","Oboe","Acordeon",
      "DJ L","DJ R","Laptop L","Laptop R","Video L","Video R","Spare 1","Spare 2","Spare 3","Spare 4"
    ];

    const baseDest = [
      "Rack A - Input 01","Rack A - Input 02","Rack A - Input 03","Rack A - Input 04",
      "Rack A - Input 05","Rack A - Input 06","Rack A - Input 07","Rack A - Input 08",
      "Rack A - Input 09","Rack A - Input 10","Rack A - Input 11","Rack A - Input 12",
      "Rack B - Input 01","Rack B - Input 02","Rack B - Input 03","Rack B - Input 04",
      "Rack B - Input 05","Rack B - Input 06","Rack B - Input 07","Rack B - Input 08",
      "FOH CH 01","FOH CH 02","FOH CH 03","FOH CH 04","FOH CH 05","FOH CH 06",
      "MON CH 01","MON CH 02","MON CH 03","MON CH 04","MON CH 05","MON CH 06",
      "IEM Lead L","IEM Lead R","IEM Coros L","IEM Coros R","IEM Batería L","IEM Batería R",
      "Wedge 1","Wedge 2","Wedge 3","Wedge 4","Drum Fill","SideFill L","SideFill R",
      "PA L","PA R","Sub Mono","FrontFill","Delay L","Delay R",
      "Matrix 1","Matrix 2","Matrix 3","Matrix 4","Broadcast L","Broadcast R","Recording L","Recording R"
    ];

    const baseMic = [
      "SM58","SM57","Beta58A","Beta57A","e835","e935","e945","MD421","RE20","M88",
      "Beta52","D112","e902","e904","e905","e906","e609",
      "C214","C414","KSM32","NT5","KM184","P170","P420",
      "R121","M160",
      "DI Activa","DI Pasiva","Radial J48","Radial ProDI","BSS AR-133","Wireless HH","Wireless Beltpack","Line In"
    ];

    const baseNotes = [
      "Phantom ON","Phantom OFF","Pad -10dB","Pad -20dB","HPF ON","HPF OFF",
      "Invertir fase","Revisar polaridad","Gate suave","Comp ligera","Sin compresión",
      "Sin EQ","EQ correctiva","No enviar a PA","Solo monitores","Solo grabación",
      "Canal de respaldo","Canal compartido","Checar clip","Ganancia baja","Ganancia media","Ganancia alta",
      "Atento feedback","Micrófono inalámbrico","Requiere soporte","Cable corto","Cable largo",
      "Mute al inicio","Abrir en canción 2","Abrir en canción 5","Talkback solo MON"
    ];

    const src = new Set(baseSource), dst = new Set(baseDest), mic = new Set(baseMic), nts = new Set(baseNotes);

    snakes().forEach(s=>{
      (s.channels||[]).forEach(c=>{ if(c.source) src.add(c.source); if(c.destination) dst.add(c.destination); if(c.micType) mic.add(c.micType); if(c.notes) nts.add(c.notes); });
      (s.returns||[]).forEach(r=>{ if(r.source) src.add(r.source); if(r.destination) dst.add(r.destination); if(r.notes) nts.add(r.notes); });
    });

    return { source:[...src].slice(0,1000), destination:[...dst].slice(0,1000), mic:[...mic].slice(0,1000), notes:[...nts].slice(0,1000) };
  }

  function fillDatalist(id, values){ $(id).innerHTML = values.map(v=>`<option value="${esc(v)}"></option>`).join(""); }
  function refreshDatalists(){
    const s = getSuggestions();
    fillDatalist("dl-source", s.source);
    fillDatalist("dl-destination", s.destination);
    fillDatalist("dl-mic", s.mic);
    fillDatalist("dl-notes", s.notes);
  }

  function renderEditor(){
    const s = snakes().find(x=>x.id===editorSnakeId); if(!s) return closeEditor();
    $("edName").value = s.name || ""; $("edZone").value = s.zone || ""; $("edColor").value = s.color || "#4f8cff";
    renderEditorBody();
  }

  let fieldEditArmed = false;
  function startFieldEdit(){
    if(!fieldEditArmed){ snapshot("field edit"); fieldEditArmed = true; setTimeout(()=>fieldEditArmed=false, 700); }
  }

  function renderEditorBody(){
    const s = snakes().find(x=>x.id===editorSnakeId); if(!s) return;
    const body = $("editorBody"); refreshDatalists();

    if(activeTab==="inputs"){
      body.innerHTML = s.channels.map((c,idx)=>`
        <div class="patch-card">
          <div class="patch-title">CH ${c.channel} <span class="small">Entrada</span></div>
          <div class="grid grid-2">
            <div><label>Fuente</label><input list="dl-source" value="${esc(c.source)}" onfocus="startFieldEdit()" oninput="updCh(${idx},'source',this.value)"></div>
            <div><label>Destino</label><input list="dl-destination" value="${esc(c.destination)}" onfocus="startFieldEdit()" oninput="updCh(${idx},'destination',this.value)"></div>
            <div><label>Mic / DI</label><input list="dl-mic" value="${esc(c.micType)}" onfocus="startFieldEdit()" oninput="updCh(${idx},'micType',this.value)"></div>
            <div><label>Notas</label><input list="dl-notes" value="${esc(c.notes)}" onfocus="startFieldEdit()" oninput="updCh(${idx},'notes',this.value)"></div>
          </div>
        </div>`).join("");
    } else {
      if(!(s.returns || []).length){
        body.innerHTML = `<div class="patch-card"><div class="small">Esta manguera no tiene salidas (0).</div></div>`;
        return;
      }

      body.innerHTML = s.returns.map((r,idx)=>`
        <div class="patch-card">
          <div class="patch-title">OUT ${r.label} <span class="small">Salida</span></div>
          <div class="grid grid-2">
            <div><label>Fuente (AUX/MATRIX)</label><input list="dl-source" value="${esc(r.source)}" onfocus="startFieldEdit()" oninput="updRet(${idx},'source',this.value)"></div>
            <div><label>Destino</label><input list="dl-destination" value="${esc(r.destination)}" onfocus="startFieldEdit()" oninput="updRet(${idx},'destination',this.value)"></div>
            <div class="grid" style="grid-column:1/-1"><label>Notas</label><input list="dl-notes" value="${esc(r.notes)}" onfocus="startFieldEdit()" oninput="updRet(${idx},'notes',this.value)"></div>
          </div>
        </div>`).join("");
    }
  }

  function updCh(idx,key,val){ const s = snakes().find(x=>x.id===editorSnakeId); if(!s) return; s.channels[idx][key]=val; renderSearchResults(); renderSheetView(); }
  function updRet(idx,key,val){ const s = snakes().find(x=>x.id===editorSnakeId); if(!s || !(s.returns||[])[idx]) return; s.returns[idx][key]=val; renderSearchResults(); renderSheetView(); }

  function applyEditorMeta(){
    const s = snakes().find(x=>x.id===editorSnakeId); if(!s) return;
    snapshot("editor meta");
    s.name = $("edName").value.trim() || s.name;
    s.zone = $("edZone").value.trim();
    s.color = $("edColor").value;
    renderList(); renderSearchResults(); refreshPrintSnakeSelect(); refreshSheetFilter(); renderSheetView();
  }

  function autoDestinationsCurrent(){
    const s = snakes().find(x=>x.id===editorSnakeId); if(!s) return;
    snapshot("auto destination");

    const base = prompt("Nombre base destino entradas:", "Rack A"); if(base === null) return;
    const start = Number(prompt("Empezar en input #:", "1")); if(Number.isNaN(start) || start < 1) return alert("Inicio inválido.");
    const end = Number(prompt("Terminar en input #:", String(start + s.channels.length - 1))); if(Number.isNaN(end) || end < 1) return alert("Fin inválido.");
    if(end < start) return alert("El final no puede ser menor que el inicio.");

    const count = end - start + 1;
    s.channels.forEach((c, i)=>{ c.destination = i < count ? `${base} - Input ${String(start + i).padStart(2,"0")}` : ""; });
    renderEditorBody(); renderSearchResults(); renderSheetView();
    alert(`Auto destino aplicado de ${start} a ${end}. El resto quedó vacío.`);
  }

  function buildPortableStagepatchObject(){
    return { app: "StagePatch Pro", format: "stagepatch", schemaVersion: STAGEPATCH_SCHEMA_VERSION, exportedAt: new Date().toISOString(), payload: appData };
  }

  function exportStagepatch(){
    if(isReadMode()) return;
    const blob = new Blob([JSON.stringify(buildPortableStagepatchObject(), null, 2)], { type: STAGEPATCH_MIME });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `stagepatch_${(appData.show.name || "show").replace(/[^\w\-]+/g,"_")}${STAGEPATCH_EXT}`;
    a.click(); URL.revokeObjectURL(a.href);
  }

  function importStagepatch(){
    if(isReadMode()) return;
    const i = document.createElement("input");
    i.type = "file";
    i.accept = `${STAGEPATCH_EXT},${STAGEPATCH_MIME},application/json`;
    i.onchange = async ()=>{
      const f = i.files?.[0]; if(!f) return;
      try{
        const data = JSON.parse(await f.text());
        snapshot("import");
        if(data?.format === "stagepatch" && data?.payload){
          appData = { show: data.payload.show || {name:"",artist:"",date:""}, snakes: data.payload.snakes || [] };
        } else if (data && Array.isArray(data.snakes)) {
          appData = { show: data.show || {name:"",artist:"",date:""}, snakes: data.snakes || [] };
        } else throw new Error("Archivo no válido de StagePatch.");
        normalize(); refreshShowInputs(); updateShowBadge(); renderList(); renderSearchResults(); refreshPrintSnakeSelect(); refreshDatalists(); refreshSheetFilter(); renderSheetView();
        alert("Archivo importado correctamente.");
      }catch(e){ alert("Error importando .stagepatch: " + e.message); }
    };
    i.click();
  }

  function clearAll(){
    if(isReadMode()) return;
    if(!confirm("¿Borrar toda la data?")) return;
    snapshot("clear all");
    appData = { show:{name:"",artist:"",date:""}, snakes:[] };
    refreshShowInputs(); updateShowBadge(); renderList(); renderSearchResults(); refreshPrintSnakeSelect(); refreshDatalists(); refreshSheetFilter(); renderSheetView();
  }

  function refreshShowInputs(){ $("showName").value = appData.show.name || ""; $("artistName").value = appData.show.artist || ""; $("showDate").value = appData.show.date || ""; }

  function renderSearchResults(){
    const q = $("search").value.trim().toLowerCase(), wrap = $("searchResults"), listEl = $("searchResultsList");
    if(!q){ wrap.style.display = "none"; listEl.innerHTML = ""; return; }

    const hits = [];
    snakes().forEach(s=>{
      s.channels.forEach(ch=>{
        if([ch.source,ch.destination,ch.micType,ch.notes,s.name,s.zone,`ch ${ch.channel}`].join(" ").toLowerCase().includes(q)){
          hits.push({ type:"Entrada", snakeId:s.id, snakeName:s.name, zone:s.zone || "-", label:`CH ${ch.channel}`, source:ch.source||"-", destination:ch.destination||"-", extra:ch.micType||"-", notes:ch.notes||"-", color:s.color });
        }
      });
      (s.returns || []).forEach(r=>{
        if([r.label,r.source,r.destination,r.notes,s.name,s.zone,`out ${r.label}`].join(" ").toLowerCase().includes(q)){
          hits.push({ type:"Salida", snakeId:s.id, snakeName:s.name, zone:s.zone || "-", label:`OUT ${r.label}`, source:r.source||"-", destination:r.destination||"-", extra:"-", notes:r.notes||"-", color:s.color });
        }
      });
    });

    if(!hits.length){ wrap.style.display = "block"; listEl.innerHTML = `<div class="small">Sin resultados para "<b>${esc(q)}</b>".</div>`; return; }

    wrap.style.display = "block";
    listEl.innerHTML = hits.map(h=>`
      <div class="result-item">
        <div class="result-top">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span class="dot" style="background:${h.color}"></span>
            <strong>${esc(h.snakeName)}</strong>
            <span class="badge">${h.type}</span>
            <span class="badge">${esc(h.label)}</span>
          </div>
          <button onclick="openSnakeAndTab('${h.snakeId}','${h.type==='Entrada' ? 'inputs' : 'outputs'}')">Abrir</button>
        </div>
        <div class="result-grid">
          <div><div class="k">Zona</div><div class="v">${esc(h.zone)}</div></div>
          <div><div class="k">Fuente</div><div class="v">${esc(h.source)}</div></div>
          <div><div class="k">Destino</div><div class="v">${esc(h.destination)}</div></div>
          <div><div class="k">Mic/DI</div><div class="v">${esc(h.extra)}</div></div>
          <div style="grid-column:1/-1"><div class="k">Notas</div><div class="v">${esc(h.notes)}</div></div>
        </div>
      </div>`).join("");
  }

  function refreshPrintSnakeSelect(){
    const sel = $("printSnakeSelect"), cur = sel.value;
    sel.innerHTML = snakes().map(s=>`<option value="${s.id}">${esc(s.name)}${s.zone ? " · " + esc(s.zone) : ""}</option>`).join("");
    if(cur && snakes().some(s=>s.id===cur)) sel.value = cur;
  }

  function getSnakesForPrint(){
    if($("printMode").value === "one"){
      const id = $("printSnakeSelect").value;
      return snakes().filter(s=>s.id===id);
    }
    return snakes();
  }

  function buildPrintView(){
    const snakesData = getSnakesForPrint();
    $("printView").innerHTML = `
      <div class="print-page">
        ${snakesData.map(s=>`
          <div class="print-snake" style="--snake-color:${esc(s.color || "#999")}">
            <h3>${esc(s.name)} <span class="muted">(${s.zone ? esc(s.zone) : "Sin zona"})</span></h3>
            <table class="print-table">
              <thead><tr><th style="width:60px">CH</th><th>Fuente</th><th>Destino</th><th>Mic/DI</th><th>Notas</th></tr></thead>
              <tbody>
                ${(s.channels || []).map(c=>`<tr><td>CH ${esc(c.channel)}</td><td>${esc(c.source || "")}</td><td>${esc(c.destination || "")}</td><td>${esc(c.micType || "")}</td><td>${esc(c.notes || "")}</td></tr>`).join("")}
              </tbody>
            </table>

            ${(s.returns || []).length ? `
            <table class="print-table">
              <thead><tr><th style="width:60px">OUT</th><th>Fuente</th><th>Destino</th><th>Notas</th></tr></thead>
              <tbody>
                ${(s.returns || []).map(r=>`<tr><td>${esc(r.label || "")}</td><td>${esc(r.source || "")}</td><td>${esc(r.destination || "")}</td><td>${esc(r.notes || "")}</td></tr>`).join("")}
              </tbody>
            </table>
            ` : ``}
          </div>`).join("") || `<div>No hay mangueras para imprimir.</div>`}
      </div>`;
  }

  function doPrint(){ buildPrintView(); window.print(); }

  function refreshSheetFilter(){
    const sel = $("sheetSnakeFilter");
    const cur = sel.value || "all";
    sel.innerHTML = `<option value="all">Todas las mangueras</option>` + snakes().map(s=>`<option value="${s.id}">${esc(s.name)}${s.zone ? " · " + esc(s.zone) : ""}</option>`).join("");
    if([...sel.options].some(o=>o.value===cur)) sel.value = cur;
  }

  function getSheetSnakes(){
    const v = $("sheetSnakeFilter").value || "all";
    return v === "all" ? snakes() : snakes().filter(s=>s.id===v);
  }

  function renderSheetView(){
    const wrap = $("sheetContainer");
    const list = getSheetSnakes();

    if(!list.length){
      wrap.innerHTML = `<div class="card"><div class="small">No hay mangueras para mostrar.</div></div>`;
      return;
    }

    wrap.innerHTML = list.map(s=>`
      <div class="sheet-group">
        <div class="sheet-head">
          <span class="dot" style="background:${s.color}"></span>
          <span>${esc(s.name)}</span>
          <span class="sheet-meta">· ${esc(s.zone || "Sin zona")} · ${s.channelsCount} entradas / ${s.returnsCount} salidas</span>
        </div>

        <div class="table-wrap">
          <table class="sheet-table">
            <thead>
              <tr>
                <th style="width:80px">CH</th>
                <th>Fuente</th>
                <th>Destino</th>
                <th>Mic/DI</th>
                <th>Notas</th>
              </tr>
            </thead>
            <tbody>
              ${(s.channels || []).map(c=>`
                <tr>
                  <td class="mono"><strong>CH ${esc(c.channel)}</strong></td>
                  <td>${esc(c.source || "—")}</td>
                  <td>${esc(c.destination || "—")}</td>
                  <td>${esc(c.micType || "—")}</td>
                  <td class="muted-x">${esc(c.notes || "—")}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>

        ${(s.returns || []).length ? `
        <div class="table-wrap">
          <table class="sheet-table">
            <thead>
              <tr>
                <th style="width:80px">OUT</th>
                <th>Fuente</th>
                <th>Destino</th>
                <th>Notas</th>
              </tr>
            </thead>
            <tbody>
              ${(s.returns || []).map(r=>`
                <tr>
                  <td class="mono"><strong>${esc(r.label || "")}</strong></td>
                  <td>${esc(r.source || "—")}</td>
                  <td>${esc(r.destination || "—")}</td>
                  <td class="muted-x">${esc(r.notes || "—")}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>` : ""}
      </div>
    `).join("");
  }

  $("saveShowMeta").addEventListener("click", saveShowMeta);
  $("createSnake").addEventListener("click", createSnake);
  $("search").addEventListener("input", ()=>{ renderList(); renderSearchResults(); });
  $("saveStagepatch").addEventListener("click", exportStagepatch);
  $("importStagepatch").addEventListener("click", importStagepatch);
  $("clearAll").addEventListener("click", clearAll);
  $("printMode").addEventListener("change", buildPrintView);
  $("printSnakeSelect").addEventListener("change", buildPrintView);
  $("printBtn").addEventListener("click", doPrint);
  $("quickNew").addEventListener("click", ()=>window.scrollTo({top:0, behavior:"smooth"}));
  $("quickPrint").addEventListener("click", doPrint);
  $("undoBtn").addEventListener("click", undo);
  $("redoBtn").addEventListener("click", redo);
  $("toggleReadMode").addEventListener("click", toggleMode);

  $("sheetSnakeFilter").addEventListener("change", renderSheetView);
  $("sheetPrintBtn").addEventListener("click", doPrint);

  document.addEventListener("keydown", e=>{
    const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
    if(mod && k==="z" && !e.shiftKey){ e.preventDefault(); undo(); }
    if((mod && k==="y") || (mod && e.shiftKey && k==="z")){ e.preventDefault(); redo(); }
  });

  $("closeEditor").addEventListener("click", ()=>{ applyEditorMeta(); closeEditor(); });
  $("tabInputs").addEventListener("click", ()=>setTab("inputs"));
  $("tabOutputs").addEventListener("click", ()=>setTab("outputs"));
  $("edName").addEventListener("input", applyEditorMeta);
  $("edZone").addEventListener("input", applyEditorMeta);
  $("edColor").addEventListener("input", applyEditorMeta);
  $("autoDestBtn").addEventListener("click", autoDestinationsCurrent);

  window.openEditor = openEditor;
  window.openSnakeAndTab = openSnakeAndTab;
  window.deleteSnake = deleteSnake;
  window.duplicateSnake = duplicateSnake;
  window.moveSnakeUp = moveSnakeUp;
  window.moveSnakeDown = moveSnakeDown;
  window.updCh = updCh;
  window.updRet = updRet;
  window.startFieldEdit = startFieldEdit;

  tryRestoreBackup();
  normalize();
  refreshShowInputs();
  updateShowBadge();
  renderList();
  renderSearchResults();
  refreshPrintSnakeSelect();
  refreshDatalists();
  refreshSheetFilter();
  renderSheetView();
  loadModePref();
  buildPrintView();
  updateUndoRedoButtons();

  setInterval(autosaveNow, 10000);
  autosaveNow();
</script>
</body>
</html>
